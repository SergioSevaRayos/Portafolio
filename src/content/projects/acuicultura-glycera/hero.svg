<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#12161A" />
  <defs>
    <pattern id="grid5" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#232A31" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid5)" opacity="0.5" />

  <text x="400" y="130" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="2" fill="#5C6773">CICLO METABÓLICO — GLYCERA DIBRANCHIATA</text>

  <!-- 5-phase timeline -->
  <g font-family="IBM Plex Mono, monospace" font-size="9" fill="#9AA4B0">
    <!-- Larva -->
    <g transform="translate(120,180)">
      <rect width="100" height="70" fill="none" stroke="#232A31" />
      <text x="10" y="20" fill="#E6EAF0" font-size="10">LARVA</text>
      <text x="10" y="38">12-14°C</text>
      <text x="10" y="52">4-6 sem</text>
    </g>
    <path d="M220 215 L248 215" stroke="#E8FF59" stroke-width="1.5" />

    <!-- Crecimiento juvenil -->
    <g transform="translate(248,180)">
      <rect width="100" height="70" fill="none" stroke="#232A31" />
      <text x="10" y="20" fill="#E6EAF0" font-size="9">JUVENIL</text>
      <text x="10" y="38">14-16°C</text>
      <text x="10" y="52">8-10 sem</text>
    </g>
    <path d="M348 215 L376 215" stroke="#E8FF59" stroke-width="1.5" />

    <!-- Pre-adulto -->
    <g transform="translate(376,180)">
      <rect width="100" height="70" fill="none" stroke="#E8FF59" />
      <text x="10" y="20" fill="#E6EAF0" font-size="9">PRE-ADULTO</text>
      <text x="10" y="38">16-18°C</text>
      <text x="10" y="52">10-12 sem</text>
    </g>
    <path d="M476 215 L504 215" stroke="#E8FF59" stroke-width="1.5" />

    <!-- Maduración -->
    <g transform="translate(504,180)">
      <rect width="100" height="70" fill="none" stroke="#232A31" />
      <text x="10" y="20" fill="#E6EAF0" font-size="9">MADURACIÓN</text>
      <text x="10" y="38">12-14°C</text>
      <text x="10" y="52">4-6 sem</text>
    </g>
    <path d="M604 215 L632 215" stroke="#E8FF59" stroke-width="1.5" />

    <!-- Reproducción -->
    <g transform="translate(632,180)">
      <rect width="90" height="70" fill="none" stroke="#232A31" stroke-dasharray="4 3" />
      <text x="10" y="20" fill="#E6EAF0" font-size="9">REPROD.</text>
      <text x="10" y="38">10-12°C</text>
      <text x="10" y="52">1-2 sem</text>
    </g>
  </g>

  <text x="400" y="310" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1" fill="#9AA4B0">FOTOPERIODO CONTROLADO POR PWM — TEMPERATURA POR PT100</text>

  <g transform="translate(300,340)" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5C6773">
    <rect x="0" y="0" width="200" height="50" fill="none" stroke="#232A31" />
    <text x="14" y="22" fill="#9AA4B0">CICLO COMPLETO</text>
    <text x="14" y="40" fill="#E8FF59">24 SEMANAS · 5 FASES</text>
  </g>

  <path d="M32 32h16M32 32v16" stroke="#E8FF59" stroke-width="1.5" />
  <path d="M768 32h-16M768 32v16" stroke="#E8FF59" stroke-width="1.5" />
  <path d="M32 468h16M32 468v-16" stroke="#E8FF59" stroke-width="1.5" />
  <path d="M768 468h-16M768 468v-16" stroke="#E8FF59" stroke-width="1.5" />
</svg>
